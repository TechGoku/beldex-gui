# Builds, tests and packages beldex-gui on Linux (x86_64 + arm64), macOS (Apple Silicon + Intel) and Windows.
# Packages are uploaded as artifacts; pushing a tag v* also attaches them to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04,     qt_arch: linux_gcc_64,    qt_dir: gcc_64 }
          - { arch: arm64,  runner: ubuntu-22.04-arm, qt_arch: linux_gcc_arm64, qt_dir: gcc_arm64 }
    # Ubuntu 22.04 (glibc 2.35) so the packages run on most current distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git autoconf automake libtool pkg-config gperf \
            rpm file python3-pip libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libxcb-shape0 libegl1 libfontconfig1 libdbus-1-3

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          pip3 install --user 'aqtinstall==3.*'
          python3 -m aqt install-qt linux desktop $QT_VERSION ${{ matrix.qt_arch }} --outputdir $HOME/Qt
          echo "QT_DIR=$HOME/Qt/$QT_VERSION/${{ matrix.qt_dir }}" >> $GITHUB_ENV

      - name: Cache Beldex core build
        uses: actions/cache@v4
        with:
          path: external/beldex/build/release
          key: core-linux-${{ matrix.arch }}-${{ hashFiles('.git/modules/external/beldex/HEAD', 'scripts/build-beldex-core.sh', 'scripts/patches/*') }}

      - name: Build Beldex core (wallet library + beldexd)
        run: ./scripts/build-beldex-core.sh

      - name: Tests (engine smoke + demo UI tour)
        run: |
          cmake -S . -B build-demo -G Ninja -DBELDEX_GUI_MOCK=ON -DCMAKE_PREFIX_PATH=$QT_DIR
          cmake --build build-demo
          QT_QPA_PLATFORM=offscreen BELDEX_GUI_SHOTS=shots ./build-demo/beldex-wallet-gui | tee tour.log
          ! grep -E 'FAIL|qrc:.*(Error|Unable|unavailable)' tour.log
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$QT_DIR
          cmake --build build --target engine_smoke
          ./build/engine_smoke

      - name: Package (AppImage, .deb, .rpm, .tar.gz)
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: beldex-wallet-linux-${{ matrix.arch }}
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  runner: macos-14 }
          - { arch: x86_64, runner: macos-13 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Tools
        run: brew install cmake ninja autoconf automake libtool pkg-config gperf

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          pip3 install --break-system-packages 'aqtinstall==3.*' || pip3 install 'aqtinstall==3.*'
          python3 -m aqt install-qt mac desktop $QT_VERSION clang_64 --outputdir $HOME/Qt
          echo "QT_DIR=$HOME/Qt/$QT_VERSION/macos" >> $GITHUB_ENV

      - name: Cache Beldex core build
        uses: actions/cache@v4
        with:
          path: external/beldex/build/release
          key: core-macos-${{ matrix.arch }}-${{ hashFiles('.git/modules/external/beldex/HEAD', 'scripts/build-beldex-core.sh', 'scripts/patches/*') }}

      - name: Build Beldex core (wallet library + beldexd)
        run: ./scripts/build-beldex-core.sh

      - name: Tests (engine smoke)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$QT_DIR
          cmake --build build --target engine_smoke
          ./build/engine_smoke

      - name: Package (.dmg)
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: beldex-wallet-macos-${{ matrix.arch }}
          path: dist/*

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # Beldex core's documented Windows toolchain is MSYS2 MinGW; Qt comes from the same environment.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make autoconf automake libtool pkgconf gperf zip
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-declarative mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools mingw-w64-x86_64-nsis

      - name: Cache Beldex core build
        uses: actions/cache@v4
        with:
          path: external/beldex/build/release
          key: core-windows-x86_64-${{ hashFiles('.git/modules/external/beldex/HEAD', 'scripts/build-beldex-core.sh', 'scripts/patches/*') }}

      - name: Build Beldex core (wallet library + beldexd)
        run: ./scripts/build-beldex-core.sh

      - name: Tests (engine smoke)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target engine_smoke
          ./build/engine_smoke.exe

      - name: Package (installer .exe, .zip)
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: beldex-wallet-windows-x86_64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/* \
            || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*

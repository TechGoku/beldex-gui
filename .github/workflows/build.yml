# Builds, tests and packages beldex-gui on Linux (x86_64 + arm64), macOS (Apple Silicon + Intel) and Windows.
# Packages are uploaded as artifacts; pushing a tag v* also attaches them to a GitHub release.
name: build

on:
  push:
    branches: ['**']   # every branch gets the full matrix, so changes are proven before they reach main
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04,     qt_host: linux,       qt_arch: linux_gcc_64,    qt_dir: gcc_64 }
          # Qt's arm64 Linux build needs glibc 2.38+, so arm64 builds on Ubuntu 24.04.
          - { arch: arm64,  runner: ubuntu-24.04-arm, qt_host: linux_arm64, qt_arch: linux_gcc_arm64, qt_dir: gcc_arm64 }
    # Ubuntu 22.04 (glibc 2.35) so the packages run on most current distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git autoconf automake libtool pkg-config gperf \
            rpm file python3-pip libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libxcb-shape0 libegl1 libfontconfig1 libdbus-1-3

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          pip3 install --user 'aqtinstall==3.*'
          python3 -m aqt install-qt ${{ matrix.qt_host }} desktop $QT_VERSION ${{ matrix.qt_arch }} --outputdir $HOME/Qt
          echo "QT_DIR=$HOME/Qt/$QT_VERSION/${{ matrix.qt_dir }}" >> $GITHUB_ENV

      - name: Cache Beldex core build
        uses: actions/cache@v4
        with:
          path: external/beldex/build/release
          key: core-linux-${{ matrix.arch }}-${{ hashFiles('.git/modules/external/beldex/HEAD', 'scripts/build-beldex-core.sh', 'scripts/patches/*') }}

      - name: Build Beldex core (wallet library + beldexd)
        run: ./scripts/build-beldex-core.sh 2>&1 | tee ci-core.log; exit ${PIPESTATUS[0]}

      - name: Tests (engine smoke + demo UI tour)
        run: |
          exec > >(tee ci-tests.log) 2>&1
          cmake -S . -B build-demo -G Ninja -DBELDEX_GUI_MOCK=ON -DCMAKE_PREFIX_PATH=$QT_DIR
          cmake --build build-demo
          QT_QPA_PLATFORM=offscreen BELDEX_GUI_SHOTS=shots ./build-demo/beldex-wallet-gui | tee tour.log
          ! grep -E 'FAIL|qrc:.*(Error|Unable|unavailable)' tour.log
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$QT_DIR
          cmake --build build --target engine_smoke
          ./build/engine_smoke

      - name: Package (AppImage, .deb, .rpm, .tar.gz)
        run: ./scripts/package.sh 2>&1 | tee ci-package.log; exit ${PIPESTATUS[0]}

      - name: Report failure (log tail as annotation)
        if: failure()
        run: |
          for f in ci-*.log; do
            [ -f "$f" ] || continue
            python3 .github/ci-report.py "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: beldex-wallet-linux-${{ matrix.arch }}
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13/14 runners are retired; macos-15-intel is GitHub's remaining Intel image.
          - { arch: arm64,  runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Tools
        run: brew install cmake ninja autoconf automake libtool pkg-config gperf

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          pip3 install --break-system-packages 'aqtinstall==3.*' || pip3 install 'aqtinstall==3.*'
          python3 -m aqt install-qt mac desktop $QT_VERSION clang_64 --outputdir $HOME/Qt
          echo "QT_DIR=$HOME/Qt/$QT_VERSION/macos" >> $GITHUB_ENV

      - name: Cache Beldex core build
        uses: actions/cache@v4
        with:
          path: external/beldex/build/release
          key: core-macos-${{ matrix.arch }}-${{ hashFiles('.git/modules/external/beldex/HEAD', 'scripts/build-beldex-core.sh', 'scripts/patches/*') }}

      - name: Build Beldex core (wallet library + beldexd)
        run: ./scripts/build-beldex-core.sh 2>&1 | tee ci-core.log; exit ${PIPESTATUS[0]}

      - name: Tests (engine smoke)
        run: |
          exec > >(tee ci-tests.log) 2>&1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$QT_DIR
          cmake --build build --target engine_smoke
          ./build/engine_smoke

      - name: Package (.dmg)
        run: ./scripts/package.sh 2>&1 | tee ci-package.log; exit ${PIPESTATUS[0]}

      - name: Report failure (log tail as annotation)
        if: failure()
        run: |
          for f in ci-*.log; do
            [ -f "$f" ] || continue
            python3 .github/ci-report.py "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: beldex-wallet-macos-${{ matrix.arch }}
          path: dist/*

  windows:
    # Cross-compiled on Linux: Beldex core's static-deps build supports Windows only this way (MinGW-w64,
    # core's cmake/64-bit-toolchain.cmake). The GUI uses Qt's official Windows MinGW build.
    name: Windows x86_64
    runs-on: ubuntu-24.04
    env:
      BELDEX_TARGET: win64
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: System packages (MinGW-w64, NSIS, Wine for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git autoconf automake libtool pkg-config gperf \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 nsis zip unzip python3-pip wine wine64

      - name: Qt ${{ env.QT_VERSION }} (Windows target + Linux host tools)
        run: |
          pip3 install --user --break-system-packages 'aqtinstall==3.*'
          python3 -m aqt install-qt linux desktop $QT_VERSION linux_gcc_64 --outputdir $HOME/Qt
          python3 -m aqt install-qt windows desktop $QT_VERSION win64_mingw --outputdir $HOME/Qt
          echo "QT_HOST_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> $GITHUB_ENV
          echo "QT_DIR=$HOME/Qt/$QT_VERSION/mingw_64" >> $GITHUB_ENV

      - name: Cache Beldex core build
        uses: actions/cache@v4
        with:
          path: external/beldex/build/win64
          key: core-win64-${{ hashFiles('.git/modules/external/beldex/HEAD', 'scripts/build-beldex-core.sh', 'scripts/patches/*') }}

      - name: Build Beldex core for Windows (wallet library + beldexd.exe)
        run: ./scripts/build-beldex-core.sh 2>&1 | tee ci-core.log; exit ${PIPESTATUS[0]}

      - name: Package (installer .exe, .zip)
        run: ./scripts/package.sh 2>&1 | tee ci-package.log; exit ${PIPESTATUS[0]}

      - name: Tests under Wine (engine smoke as a Windows binary)
        run: |
          exec > >(tee ci-tests.log) 2>&1
          cmake --build build-win64 --target engine_smoke
          mkdir -p wine-test && cd wine-test
          unzip -q ../dist/*windows-x86_64.zip
          cp ../build-win64/engine_smoke.exe */bin/
          WINEDEBUG=-all timeout 300 wine */bin/engine_smoke.exe

      - uses: actions/upload-artifact@v4
        with:
          name: beldex-wallet-windows-x86_64
          path: dist/*

      - name: Report failure (log tail as annotation)
        if: failure()
        run: |
          for f in ci-*.log; do
            [ -f "$f" ] || continue
            python3 .github/ci-report.py "$f"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4          # for .github/release-notes.md only
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions and tags with a suffix (v1.0.0-rc1) are published as pre-releases.
          PRE=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Beldex Wallet $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes $PRE dist/* \
            || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
